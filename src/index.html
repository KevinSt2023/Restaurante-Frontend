<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Valexa · Software para restaurantes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D1C30">
  <meta name="description" content="Valexa: mesas, pedidos, cocina, caja y delivery para restaurantes.">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- PWA: el mesero y el repartidor la instalan y la usan como app. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Valexa">
  <!-- En una tablet de salón, el zoom accidental con dos dedos es un estorbo. -->
  <meta name="format-detection" content="telephone=no">
  <script>
    // Tema antes de pintar: evita el destello claro al abrir en modo oscuro.
    try { var t = localStorage.getItem('vf_tema'); if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script>
    // El service worker se registra después de cargar: nunca compite con la
    // primera pintada. Solo en https o localhost, que es donde el navegador lo
    // permite.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
